    Teaching and Academic Service:
      - company: Korea Astronomy Olympiad, Korean Astronomical Society
        position: Instructor and Teaching Assistant for National Team Training
        date: Apr. 2026–present
        highlights:
          - Train the Korean national team for the International Olympiad on Astronomy and Astrophysics.
          - Develop theoretical and data analysis problems, including four long form problems for four hour sessions and three medium length problems designed for 10–30 minutes each.
          - Organized two national team training camps, coordinating schedules and instruction.

      - company: Seoul National University and Korea Advanced Institute of Science and Technology
        position: Core Member, Astronomy Student Led Journal Club
        date: Sep. 2025–present
        highlights:
          - Co lead a weekly journal club for two undergraduate and five graduate students.
          - Presented in depth 1.5 hour reviews and led discussions of seven research papers.

      - company: Seoul National University
        position: Peer Tutor, Calculus I and General Physics I–II
        date: 2024–2026, four semesters
        highlights:
          - Led 2.5 hours per week of supplemental lectures and problem solving sessions for groups of two to six undergraduates each semester.
          - Provided bilingual tutoring to a student with prior education abroad in General Physics I in 2026.
          - Received Best Tutor awards in Calculus I and General Physics I in Spring 2026.

      - company: Korean Mathematical Society and Korean Astronomical Society
        position: Mentor, Career Mentoring Program Led by Former National Olympiad Representatives
        date: 2023
        highlights:
          - Guided three high school students from rural areas in an exoplanet analysis project using Kepler transit data.
          - Delivered five one hour introductory astronomy lectures.
          - Led the team to First Prize in the Astronomy Division.

      - company: Seoul National University Social Responsibility
        position: Volunteer and Camp Organizer, SHANUM Community Service
        date: 2023
        highlights:
          - Contributed more than 100 volunteer hours to programs serving migrant youth, children, and workers.
          - Organized educational camps and community festival booths for youth from migrant backgrounds.

