        details: "<div class='mt-2 mb-4'><p>Song, H., Jeon, J., Taylor, A., &amp; Bromm, V.</p><p>Submitted to ApJ (2026).</p></div>"

      - label: "Evolution of Massive Black Holes and the Formation of Multiple MBH Systems during Hierarchical Galaxy Assembly in the LUMINA Simulation"
        details: "<div class='mt-2 mb-4'><p>Song, H., Zier, O., Shen, X., Riu, R., et al.</p><p>In preparation.</p></div>"

    "Research Experience":
      - label: "Student Directed Research Project, Ray Tracing Framework for Schwarzschild and Kerr Metrics"
        details: "<div class='mt-2 mb-4'><p class='mb-1'>Seoul National University</p><p class='mb-1'>Jun. 2026–present</p><p>Advisor: Sascha Trippe</p><ul><li>Secured approximately $2,000 in funding for a project I proposed.</li><li>Implemented a parallelized C++ Hamiltonian solver for photon geodesics in Kerr spacetime.</li><li>Extended the solver to ray trace thin Keplerian disks and generate relativistic images.</li><li>Developed a hands-on teaching tool to explore how light bending, Doppler shifts, and gravitational redshift shape disk images.</li></ul></div>"

      - label: "Self-Initiated Research Project, Multiple Massive Black Holes in the LUMINA Cosmological Simulation"
        details: "<div class='mt-2 mb-4'><p class='mb-1'>Center for Astrophysics | Harvard &amp; Smithsonian and MIT</p><p class='mb-1'>Feb. 2026–present</p><p>Advisors: Oliver Zier, LUMINA PI; Jacob Shen</p><ul><li>Connected LUMINA cosmological merger histories with Holodeck binary evolution models to extend dual AGN forecasts to z = 6.6 and assess LISA detectability.</li><li>Translated these forecasts into survey requirements, estimating that a survey of approximately 300 arcmin² at 3 &lt; z ≲ 6 could detect at least 10 potential dual AGNs with greater than 90% probability.</li><li>Studied the potential importance of MBH triplets for SMBH growth and demographics, estimating that approximately 20% of galaxies undergoing multiple mergers may temporarily host one.</li></ul></div>"

      - label: "Research Assistant, JWST Observability of SMBHs Across Seeding and Growth Scenarios"
        details: "<div class='mt-2 mb-4'><p class='mb-1'>University of Texas at Austin</p><p class='mb-1'>Feb. 2025–Feb. 2026</p><p>Advisor: Volker Bromm</p><ul><li>Integrated SMBH seeding and growth prescriptions to evaluate their photometric detectability with JWST.</li><li>Evaluated high-ionization line diagnostics using mock spectra where Balmer lines are inaccessible.</li><li>Projected that JWST could detect and identify SMBHs out to z ∼ 16 under optimistic assumptions.</li></ul></div>"

      - label: "Undergraduate Research Intern, AGN Activity and Star Formation: SED Analysis of Type 1 AGNs"
        details: "<div class='mt-2 mb-4'><p class='mb-1'>Seoul National University</p><p class='mb-1'>Dec. 2023–Dec. 2024</p><p>Advisor: Jong-Hak Woo</p><ul><li>Estimated SFRs of Type 1 AGN host galaxies by fitting their multiwavelength SEDs with CIGALE, using SDSS spectra and catalog photometry.</li><li>Tested how missing FIR data affected SFR estimates by comparing fits with and without FIR photometry, extending the analysis to hosts without FIR measurements.</li><li>Found a weak positive correlation between AGN activity and host galaxy SFR, with no evidence of SFR suppression in the sample.</li></ul></div>"

