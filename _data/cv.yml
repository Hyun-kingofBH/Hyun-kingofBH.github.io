    "Teaching and Academic Service":
      - label: "Instructor and Teaching Assistant for National Team Training"
        details: "Korea Astronomy Olympiad, Korean Astronomical Society | Apr. 2026–present. Train the Korean national team for the International Olympiad on Astronomy and Astrophysics; develop theoretical and data-analysis problems, including four long-form problems for four-hour sessions and three medium-form problems designed for 10–30 minutes each; organized two national team training camps, coordinating schedules and instruction."

      - label: "Core Member, Astronomy Student-Led Journal Club"
        details: "Seoul National University and Korea Advanced Institute of Science and Technology | Sep. 2025–present. Co-lead a weekly journal club for two undergraduate and five graduate students; presented in-depth 1.5-hour reviews and led discussions of seven research papers."

      - label: "Peer Tutor, Calculus I and General Physics I–II"
        details: "Seoul National University | 2024–2026, four semesters. Led 2.5 hours per week of supplemental lectures and problem-solving sessions for groups of two to six undergraduates each semester; provided bilingual tutoring to a student with prior education abroad in General Physics I in 2026; received Best Tutor awards in Calculus I and General Physics I in Spring 2026."

      - label: "Mentor, Career Mentoring Program Led by Former National Olympiad Representatives"
        details: "Korean Mathematical Society and Korean Astronomical Society | 2023. Guided three high school students from rural areas in an exoplanet analysis project using Kepler transit data; delivered five one-hour introductory astronomy lectures; led the team to First Prize in the Astronomy Division."

      - label: "Volunteer and Camp Organizer, SHANUM Community Service"
        details: "Seoul National University Social Responsibility | 2023. Contributed more than 100 volunteer hours to programs serving migrant youth, children, and workers; organized educational camps and community festival booths for youth from migrant backgrounds."

