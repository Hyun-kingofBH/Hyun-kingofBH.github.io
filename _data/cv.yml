        details: "<div class='mt-2 mb-4'><p class='mb-1'>Seoul National University</p><p>2024–2026, four semesters</p><ul><li>Led 2.5 hours per week of supplemental lectures and problem-solving sessions for groups of two to six undergraduates each semester.</li><li>Provided bilingual tutoring to a student with prior education abroad in General Physics I in 2026.</li><li>Received Best Tutor awards in Calculus I and General Physics I in Spring 2026.</li></ul></div>"

