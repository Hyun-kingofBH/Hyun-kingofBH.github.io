  sections:
    "Research Interests":
      - bullet: "I am interested in modeling extreme phenomena near black holes, including relativistic accretion flows and black hole inspirals."

    "Education":
      - institution: "Seoul National University"
        area: "Physics and Astronomy"
        degree: "B.S. Candidate, double major (expected 2027)"
        start_date: "2020"
        end_date: "2027"
        location: "Seoul, Korea"

      - institution: "University of Texas at Austin"
        area: "Astronomy"
        degree: "Exchange Program"
        date: "2025"
        location: "Austin, Texas"
        highlights:
          - "Selected coursework: General Relativity (A), Cosmology (A), Astrophysics (A)"
          - "Exchange semester followed by a summer research assistantship."

    "Selected Publications":
      - label: "Observing the First Supermassive Black Holes with JWST"
        details: "Song, H., Jeon, J., Taylor, A., & Bromm, V. In preparation."

      - label: "Evolution of Massive Black Holes and the Formation of Multiple MBH Systems during Hierarchical Galaxy Assembly in the LUMINA Simulation"
        details: "Song, H., Zier, O., Shen, X., Riu, R., et al. In preparation."

    "Research Experience":
      - label: "Student Directed Research Project, Ray Tracing Framework for Schwarzschild and Kerr Metrics"
        details: "Seoul National University | Jun. 2026–present. Secured approximately $2,000 in funding for a project I proposed; implemented a parallelized C++ Hamiltonian solver for photon geodesics in Kerr spacetime; extended the solver to ray trace thin Keplerian disks and generate relativistic images; developed a hands-on teaching tool to explore how light bending, Doppler shifts, and gravitational redshift shape disk images. Advisor: Sascha Trippe."

      - label: "Self-Initiated Research Project, Multiple Massive Black Holes in the LUMINA Cosmological Simulation"
        details: "Center for Astrophysics | Harvard & Smithsonian and MIT | Feb. 2026–present. Connected LUMINA cosmological merger histories with Holodeck binary evolution models to extend dual AGN forecasts to $z=6.6$ and assess LISA detectability; translated these forecasts into survey requirements, estimating that a survey of approximately $300\\,\\mathrm{arcmin}^2$ at $3<z\\lesssim6$ could detect at least 10 potential dual AGNs with greater than 90% probability; studied the potential importance of MBH triplets for SMBH growth and demographics, estimating that approximately 20% of galaxies undergoing multiple mergers may temporarily host one. Advisors: Oliver Zier, LUMINA PI; Jacob Shen."

      - label: "Research Assistant, JWST Observability of SMBHs Across Seeding and Growth Scenarios"
        details: "University of Texas at Austin | Feb. 2025–Feb. 2026. Integrated SMBH seeding and growth prescriptions to evaluate their photometric detectability with JWST; evaluated high-ionization line diagnostics using mock spectra where Balmer lines are inaccessible; projected that JWST could detect and identify SMBHs out to $z\\sim16$ under optimistic assumptions. Advisor: Volker Bromm."

      - label: "Undergraduate Research Intern, AGN Activity and Star Formation: SED Analysis of Type 1 AGNs"
        details: "Seoul National University | Dec. 2023–Dec. 2024. Estimated SFRs of Type 1 AGN host galaxies by fitting their multiwavelength SEDs with CIGALE, using SDSS spectra and catalog photometry; tested how missing FIR data affected SFR estimates by comparing fits with and without FIR photometry, extending the analysis to hosts without FIR measurements; found a weak positive correlation between AGN activity and host galaxy SFR, with no evidence of SFR suppression in the sample. Advisor: Jong-Hak Woo."

